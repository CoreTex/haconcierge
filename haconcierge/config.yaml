---
name: HAConcierge
version: "1.0.7"
slug: haconcierge
description: "WhatsApp AI Concierge - Nachrichten, Termine und Aufgaben fuer Home Assistant"
url: https://github.com/CoreTex/haconcierge
arch:
  - aarch64
  - amd64
startup: application
boot: auto
map:
  - config:rw
ingress: true
ingress_port: 8099
panel_icon: mdi:robot
panel_title: HAConcierge
homeassistant_api: true
auth_api: true
hassio_api: true
hassio_role: default
environment:
  PYTHONUNBUFFERED: "1"
  NODE_ENV: "production"
options:
  log_level: "info"
schema:
  log_level: "str"
image: "ghcr.io/coretex/haconcierge-{arch}"
