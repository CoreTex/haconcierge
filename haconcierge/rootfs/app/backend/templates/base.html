<!DOCTYPE html>
<html lang="de" style="height:100%;background:#030712">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HAConcierge</title>
  <base href="{{ ingress_path }}/">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <script src="https://unpkg.com/htmx.org@2.0.3/dist/ext/json-enc.js"></script>
  <style>
    /* Component classes using plain CSS – avoids @apply CDN timing issues */

    *, *::before, *::after { box-sizing: border-box; }

    .nav-link {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.5rem 0.75rem; border-radius: 0.5rem;
      color: #9ca3af; font-size: 0.875rem; text-decoration: none;
      transition: background-color 0.15s, color 0.15s;
    }
    .nav-link:hover { background-color: #1f2937; color: #fff; }
    .nav-link.active { background-color: rgba(30,58,138,0.5); color: #93c5fd; font-weight: 500; }

    .card {
      background-color: #111827; border: 1px solid #1f2937;
      border-radius: 0.75rem; padding: 1.25rem;
    }
    .card-hover {
      background-color: #111827; border: 1px solid #1f2937;
      border-radius: 0.75rem; padding: 1rem;
      transition: border-color 0.15s;
    }
    .card-hover:hover { border-color: #374151; }
    .stat-card {
      background-color: #111827; border: 1px solid #1f2937;
      border-radius: 0.75rem; padding: 1.25rem;
      display: flex; flex-direction: column; gap: 0.25rem;
    }

    .btn-primary {
      display: inline-flex; align-items: center; justify-content: center;
      background-color: #2563eb; color: #fff;
      padding: 0.5rem 1rem; border-radius: 0.5rem;
      font-size: 0.875rem; font-weight: 500; border: none;
      cursor: pointer; transition: background-color 0.15s;
      text-decoration: none;
    }
    .btn-primary:hover { background-color: #1d4ed8; }
    .btn-primary:active { background-color: #1e40af; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-secondary {
      display: inline-flex; align-items: center; justify-content: center;
      background-color: #374151; color: #fff;
      padding: 0.5rem 1rem; border-radius: 0.5rem;
      font-size: 0.875rem; font-weight: 500; border: none;
      cursor: pointer; transition: background-color 0.15s;
      text-decoration: none;
    }
    .btn-secondary:hover { background-color: #4b5563; }
    .btn-secondary:active { background-color: #6b7280; }

    .btn-danger {
      display: inline-flex; align-items: center; justify-content: center;
      background-color: rgba(185,28,28,0.85); color: #fff;
      padding: 0.375rem 0.75rem; border-radius: 0.5rem;
      font-size: 0.75rem; font-weight: 500; border: none;
      cursor: pointer; transition: background-color 0.15s;
    }
    .btn-danger:hover { background-color: #dc2626; }

    .input {
      background-color: #1f2937 !important;
      border: 1px solid #374151;
      color: #f9fafb !important;
      border-radius: 0.5rem;
      padding: 0.5rem 0.75rem;
      font-size: 0.875rem;
      width: 100%;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      -webkit-appearance: none;
      appearance: none;
    }
    .input::placeholder { color: #4b5563; }
    .input:focus { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59,130,246,0.2); }
    .input:-webkit-autofill,
    .input:-webkit-autofill:hover,
    .input:-webkit-autofill:focus {
      -webkit-box-shadow: 0 0 0 1000px #1f2937 inset !important;
      -webkit-text-fill-color: #f9fafb !important;
      caret-color: #f9fafb;
    }
    select.input { background-image: none; }

    .badge-green {
      display: inline-flex; align-items: center;
      padding: 0.125rem 0.5rem; border-radius: 0.375rem;
      font-size: 0.75rem; font-weight: 500;
      background-color: rgba(20,83,45,0.5); color: #86efac;
      border: 1px solid rgba(22,101,52,0.35);
    }
    .badge-yellow {
      display: inline-flex; align-items: center;
      padding: 0.125rem 0.5rem; border-radius: 0.375rem;
      font-size: 0.75rem; font-weight: 500;
      background-color: rgba(113,63,18,0.5); color: #fde047;
      border: 1px solid rgba(133,77,14,0.35);
    }
    .badge-red {
      display: inline-flex; align-items: center;
      padding: 0.125rem 0.5rem; border-radius: 0.375rem;
      font-size: 0.75rem; font-weight: 500;
      background-color: rgba(127,29,29,0.5); color: #fca5a5;
      border: 1px solid rgba(153,27,27,0.35);
    }
    .badge-blue {
      display: inline-flex; align-items: center;
      padding: 0.125rem 0.5rem; border-radius: 0.375rem;
      font-size: 0.75rem; font-weight: 500;
      background-color: rgba(30,58,138,0.5); color: #93c5fd;
      border: 1px solid rgba(30,64,175,0.35);
    }

    .skeleton {
      background-color: #1f2937; border-radius: 0.5rem;
      animation: ha-pulse 1.8s ease-in-out infinite;
    }
    @keyframes ha-pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    /* Toast animation */
    .toast-enter { animation: toastIn 0.2s ease; }
    @keyframes toastIn { from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:translateY(0)} }
  </style>
  <script>
    tailwind.config = { darkMode: 'class' }

    // HA Ingress: prefix all fetch/htmx calls with the proxy path
    const INGRESS = "{{ ingress_path }}";

    document.addEventListener('htmx:configRequest', function(evt) {
      const path = evt.detail.path;
      if (INGRESS && !path.startsWith(INGRESS)) {
        evt.detail.path = INGRESS + (path.startsWith('/') ? path : '/' + path);
      }
    });

    function apiFetch(path, opts) {
      return fetch(INGRESS ? INGRESS + path : path, opts);
    }

    function showToast(msg, type = 'success') {
      const t = document.createElement('div');
      const isSuccess = type === 'success';
      t.style.cssText = [
        'position:fixed;top:1rem;right:1rem;z-index:9999',
        'padding:0.75rem 1rem;border-radius:0.75rem',
        'font-size:0.875rem;font-weight:500;',
        'box-shadow:0 4px 24px rgba(0,0,0,0.5)',
        'border:1px solid ' + (isSuccess ? '#166534' : '#991b1b'),
        'background-color:#111827',
        'color:' + (isSuccess ? '#86efac' : '#fca5a5'),
        'transition:opacity 0.2s',
      ].join(';');
      t.className = 'toast-enter';
      t.textContent = (isSuccess ? '✓  ' : '✗  ') + msg;
      document.body.appendChild(t);
      setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 250); }, 3000);
    }

    document.addEventListener('htmx:responseError', e =>
      showToast('Server-Fehler ' + e.detail.xhr.status, 'error'));
  </script>
</head>
<body style="height:100%;color:#f9fafb;margin:0">
<div style="display:flex;height:100vh;overflow:hidden">

  <!-- Sidebar -->
  <aside style="width:208px;background:#111827;border-right:1px solid #1f2937;display:flex;flex-direction:column;flex-shrink:0">
    <!-- Logo -->
    <div style="display:flex;align-items:center;gap:10px;padding:18px 16px 16px;border-bottom:1px solid #1f2937">
      <span style="font-size:1.25rem">🤵</span>
      <span style="font-weight:700;font-size:0.95rem;color:#fff;letter-spacing:-0.01em">HAConcierge</span>
    </div>

    <!-- Navigation -->
    <nav style="flex:1;display:flex;flex-direction:column;gap:2px;padding:12px;overflow-y:auto">
      <a href="{{ ingress_path }}/" class="nav-link {% if page == 'dashboard' %}active{% endif %}">
        <span>📊</span> Dashboard
      </a>
      <a href="{{ ingress_path }}/owners" class="nav-link {% if page == 'owners' %}active{% endif %}">
        <span>👨‍👩‍👧‍👦</span> Besitzer
      </a>
      <a href="{{ ingress_path }}/groups" class="nav-link {% if page == 'groups' %}active{% endif %}">
        <span>💬</span> Gruppen
      </a>
      <a href="{{ ingress_path }}/messages" class="nav-link {% if page == 'messages' %}active{% endif %}">
        <span>📨</span> Nachrichten
      </a>
      <a href="{{ ingress_path }}/tasks" class="nav-link {% if page == 'tasks' %}active{% endif %}">
        <span>✅</span> Aufgaben
      </a>
      <a href="{{ ingress_path }}/appointments" class="nav-link {% if page == 'appointments' %}active{% endif %}">
        <span>📅</span> Termine
      </a>
    </nav>

    <!-- Bottom -->
    <div style="padding:12px;border-top:1px solid #1f2937;display:flex;flex-direction:column;gap:8px">
      <a href="{{ ingress_path }}/settings/whatsapp" class="nav-link {% if page == 'settings' %}active{% endif %}">
        <span>⚙️</span> Einstellungen
      </a>
      <div id="wa-status" style="padding:8px 12px;border-radius:8px;background:rgba(255,255,255,0.04)">
        <div style="display:flex;align-items:center;gap:8px">
          <div style="width:8px;height:8px;border-radius:50%;background:#4b5563"></div>
          <span style="font-size:0.7rem;color:#6b7280">Verbinde...</span>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main content -->
  <main style="flex:1;overflow-y:auto;background:#030712;padding:1.5rem">
    {% block content %}{% endblock %}
  </main>
</div>

<script>
  async function refreshWAStatus() {
    try {
      const r = await apiFetch('/api/whatsapp/status');
      const s = await r.json();
      const el = document.getElementById('wa-status');
      if (!el) return;
      if (s.connected) {
        el.innerHTML = `<div style="display:flex;align-items:center;gap:8px">
          <div style="width:8px;height:8px;border-radius:50%;background:#22c55e"></div>
          <span style="font-size:0.7rem;color:#4ade80">Verbunden${s.phone ? ' (+' + s.phone + ')' : ''}</span>
        </div>`;
      } else {
        el.innerHTML = `<div style="display:flex;align-items:center;gap:8px">
          <div style="width:8px;height:8px;border-radius:50%;background:#ef4444"></div>
          <span style="font-size:0.7rem;color:#f87171">${s.status || 'Getrennt'}</span>
        </div>`;
      }
    } catch { /* bridge not ready */ }
  }
  refreshWAStatus();
  setInterval(refreshWAStatus, 30000);
</script>
</body>
</html>
