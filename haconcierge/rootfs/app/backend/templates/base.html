<!DOCTYPE html>
<html lang="de" class="h-full bg-gray-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HAConcierge</title>
  <base href="{{ ingress_path }}/">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <script src="https://unpkg.com/htmx.org@2.0.3/dist/ext/json-enc.js"></script>
  <style>
    .nav-link { @apply flex items-center gap-3 px-3 py-2 rounded-lg text-gray-400 hover:bg-gray-800 hover:text-white transition-colors text-sm; }
    .nav-link.active { @apply bg-blue-900/60 text-blue-300 font-medium; }
    .card { @apply bg-gray-900 border border-gray-800 rounded-xl p-5; }
    .card-hover { @apply bg-gray-900 border border-gray-800 rounded-xl p-4 hover:border-gray-700 transition-colors; }
    .btn-primary { @apply bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors disabled:opacity-50 disabled:cursor-not-allowed; }
    .btn-secondary { @apply bg-gray-700 hover:bg-gray-600 active:bg-gray-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors; }
    .btn-danger { @apply bg-red-700/80 hover:bg-red-600 active:bg-red-700 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition-colors; }
    .input { @apply bg-gray-800 border border-gray-700 text-white rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500 w-full placeholder-gray-600 transition-colors; }
    .badge-green { @apply inline-flex items-center px-2 py-0.5 rounded-md text-xs font-medium bg-green-900/60 text-green-300 border border-green-800/40; }
    .badge-yellow { @apply inline-flex items-center px-2 py-0.5 rounded-md text-xs font-medium bg-yellow-900/60 text-yellow-300 border border-yellow-800/40; }
    .badge-red { @apply inline-flex items-center px-2 py-0.5 rounded-md text-xs font-medium bg-red-900/60 text-red-300 border border-red-800/40; }
    .badge-blue { @apply inline-flex items-center px-2 py-0.5 rounded-md text-xs font-medium bg-blue-900/60 text-blue-300 border border-blue-800/40; }
    .skeleton { @apply bg-gray-800 rounded-lg animate-pulse; }
    .divider { @apply border-t border-gray-800; }
    .stat-card { @apply card flex flex-col gap-1; }
  </style>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: {} } }

    // HA Ingress: prefix all fetch/htmx calls with the proxy path
    const INGRESS = "{{ ingress_path }}";

    document.addEventListener('htmx:configRequest', function(evt) {
      const path = evt.detail.path;
      if (INGRESS && !path.startsWith(INGRESS)) {
        evt.detail.path = INGRESS + (path.startsWith('/') ? path : '/' + path);
      }
    });

    function apiFetch(path, opts) {
      return fetch(INGRESS ? INGRESS + path : path, opts);
    }

    function showToast(msg, type = 'success') {
      const t = document.createElement('div');
      t.className = [
        'fixed top-4 right-4 z-50 px-4 py-3 rounded-xl text-sm font-medium shadow-2xl',
        'border transition-all duration-200',
        type === 'success'
          ? 'bg-gray-900 border-green-700 text-green-300'
          : 'bg-gray-900 border-red-700 text-red-300'
      ].join(' ');
      t.textContent = (type === 'success' ? '✓ ' : '✗ ') + msg;
      document.body.appendChild(t);
      setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 200); }, 3000);
    }

    document.addEventListener('htmx:responseError', e => showToast('Server-Fehler: ' + e.detail.xhr.status, 'error'));
  </script>
</head>
<body class="h-full text-white">
<div class="flex h-screen overflow-hidden">
  <!-- Sidebar -->
  <aside class="w-52 bg-gray-900 border-r border-gray-800 flex flex-col shrink-0">
    <!-- Logo -->
    <div class="flex items-center gap-2.5 px-4 py-5 border-b border-gray-800">
      <span class="text-xl">🤵</span>
      <span class="font-bold text-base text-white tracking-tight">HAConcierge</span>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 flex flex-col gap-0.5 p-3 overflow-y-auto">
      <a href="{{ ingress_path }}/" class="nav-link {% if page == 'dashboard' %}active{% endif %}">
        <span class="text-base">📊</span> Dashboard
      </a>
      <a href="{{ ingress_path }}/owners" class="nav-link {% if page == 'owners' %}active{% endif %}">
        <span class="text-base">👨‍👩‍👧‍👦</span> Besitzer
      </a>
      <a href="{{ ingress_path }}/groups" class="nav-link {% if page == 'groups' %}active{% endif %}">
        <span class="text-base">💬</span> Gruppen
      </a>
      <a href="{{ ingress_path }}/messages" class="nav-link {% if page == 'messages' %}active{% endif %}">
        <span class="text-base">📨</span> Nachrichten
      </a>
      <a href="{{ ingress_path }}/tasks" class="nav-link {% if page == 'tasks' %}active{% endif %}">
        <span class="text-base">✅</span> Aufgaben
      </a>
      <a href="{{ ingress_path }}/appointments" class="nav-link {% if page == 'appointments' %}active{% endif %}">
        <span class="text-base">📅</span> Termine
      </a>
    </nav>

    <!-- Bottom: Settings + WA Status -->
    <div class="p-3 border-t border-gray-800 space-y-2">
      <a href="{{ ingress_path }}/settings/whatsapp" class="nav-link {% if page == 'settings' %}active{% endif %}">
        <span class="text-base">⚙️</span> Einstellungen
      </a>
      <div id="wa-status" class="px-3 py-2 rounded-lg bg-gray-800/50">
        <div class="flex items-center gap-2">
          <div class="w-2 h-2 rounded-full bg-gray-600 animate-pulse"></div>
          <span class="text-xs text-gray-500">Verbinde...</span>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main content -->
  <main class="flex-1 overflow-y-auto bg-gray-950 p-6">
    {% block content %}{% endblock %}
  </main>
</div>

<script>
  // WA status in sidebar – pure JS polling, no htmx
  async function refreshWAStatus() {
    try {
      const r = await apiFetch('/api/whatsapp/status');
      const s = await r.json();
      const el = document.getElementById('wa-status');
      if (!el) return;
      if (s.connected) {
        el.innerHTML = `<div class="flex items-center gap-2">
          <div class="w-2 h-2 rounded-full bg-green-500"></div>
          <span class="text-xs text-green-400">Verbunden${s.phone ? ' (+' + s.phone + ')' : ''}</span>
        </div>`;
      } else {
        el.innerHTML = `<div class="flex items-center gap-2">
          <div class="w-2 h-2 rounded-full bg-red-500"></div>
          <span class="text-xs text-red-400">${s.status || 'Getrennt'}</span>
        </div>`;
      }
    } catch { /* bridge not ready yet */ }
  }
  refreshWAStatus();
  setInterval(refreshWAStatus, 30000);
</script>
</body>
</html>
