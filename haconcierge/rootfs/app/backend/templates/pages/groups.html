{% extends "base.html" %}
{% set page = "groups" %}
{% block content %}
<div class="max-w-3xl mx-auto">
  <div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-bold">WhatsApp Gruppen</h1>
    <button class="btn-secondary" onclick="syncGroups()">↻ Synchronisieren</button>
  </div>

  <div id="groups-list" hx-get="/api/whatsapp/groups" hx-trigger="load" hx-swap="innerHTML">
    <div class="text-gray-500 text-sm">Lade Gruppen...</div>
  </div>
</div>

<script>
  document.addEventListener('htmx:afterRequest', function(e) {
    if (!e.detail.pathInfo.requestPath.includes('/api/whatsapp/groups')) return;
    if (e.detail.requestConfig.verb !== 'get') return;
    try {
      const groups = JSON.parse(e.detail.xhr.responseText);
      document.getElementById('groups-list').innerHTML = groups.length ? groups.map(g => `
        <div class="card mb-3 flex items-center justify-between">
          <div>
            <div class="flex items-center gap-2">
              <span class="font-medium">${g.name}</span>
              ${g.monitored
                ? '<span class="badge-green">überwacht</span>'
                : '<span class="badge-red">pausiert</span>'}
            </div>
            <p class="text-xs text-gray-500 mt-1">${g.participant_count} Teilnehmer · ${g.jid}</p>
            ${g.last_seen ? `<p class="text-xs text-gray-600">Zuletzt: ${new Date(g.last_seen).toLocaleString('de-DE')}</p>` : ''}
          </div>
          <div class="flex gap-2 shrink-0">
            <button class="btn-secondary text-xs"
                    onclick="toggleMonitor(${g.id}, ${!g.monitored})">
              ${g.monitored ? '⏸ Pausieren' : '▶ Aktivieren'}
            </button>
            <button class="btn-danger text-xs"
                    onclick="leaveGroup(${g.id}, '${g.name}')">
              Austreten
            </button>
          </div>
        </div>
      `).join('') : '<div class="card text-gray-500 text-center py-10">Keine Gruppen gefunden. Synchronisieren?</div>';
    } catch(e) { console.error(e); }
  });

  async function toggleMonitor(id, monitored) {
    await fetch(`/api/whatsapp/groups/${id}`, {
      method: 'PUT', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({monitored})
    });
    htmx.ajax('GET', '/api/whatsapp/groups', {target: '#groups-list', swap: 'innerHTML'});
    showToast(monitored ? 'Gruppe wird überwacht' : 'Gruppe pausiert');
  }

  async function leaveGroup(id, name) {
    if (!confirm(`Aus Gruppe "${name}" austreten? Dies kann nicht rückgängig gemacht werden.`)) return;
    const resp = await fetch(`/api/whatsapp/groups/${id}/leave`, {method: 'POST'});
    const data = await resp.json();
    if (data.success) {
      htmx.ajax('GET', '/api/whatsapp/groups', {target: '#groups-list', swap: 'innerHTML'});
      showToast(`Aus "${name}" ausgetreten`);
    } else { showToast('Fehler beim Austreten', 'error'); }
  }

  function syncGroups() {
    htmx.ajax('GET', '/api/whatsapp/groups', {target: '#groups-list', swap: 'innerHTML'});
    showToast('Gruppen werden synchronisiert...');
  }
</script>
{% endblock %}
