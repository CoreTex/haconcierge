{% extends "base.html" %}
{% set page = "owners" %}
{% block content %}
<div class="max-w-4xl mx-auto">
  <div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-bold">Besitzer</h1>
    <button class="btn-primary" onclick="openAddModal()">+ Besitzer hinzufügen</button>
  </div>

  <div id="owners-list" class="space-y-4">
    <div class="card skeleton h-24"></div>
    <div class="card skeleton h-24"></div>
  </div>
</div>

<!-- Add Owner Modal -->
<div id="add-owner-modal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50 p-4">
  <div class="bg-gray-900 border border-gray-700 rounded-2xl p-6 w-full max-w-md shadow-2xl">
    <div class="flex items-center justify-between mb-5">
      <h2 class="text-lg font-semibold">Neuer Besitzer</h2>
      <button onclick="closeAddModal()" class="text-gray-500 hover:text-white text-xl leading-none">✕</button>
    </div>
    <form id="add-owner-form" class="space-y-4">
      <div>
        <label class="text-xs text-gray-400 mb-1.5 block font-medium">Name *</label>
        <input type="text" name="name" required class="input" placeholder="z. B. Anna">
      </div>
      <div>
        <label class="text-xs text-gray-400 mb-1.5 block font-medium">Telefonnummer *</label>
        <input type="text" name="phone" required class="input" placeholder="491701234567 (ohne +)">
      </div>
      <div>
        <label class="text-xs text-gray-400 mb-1.5 block font-medium">Aliase <span class="font-normal text-gray-600">(kommagetrennt)</span></label>
        <input type="text" name="aliases_raw" class="input" placeholder="Mama, Mutter, Anna">
        <p class="text-xs text-gray-600 mt-1">Diese Namen werden in Nachrichten erkannt</p>
      </div>
      <div>
        <label class="text-xs text-gray-400 mb-1.5 block font-medium">O365 E-Mail <span class="font-normal text-gray-600">(optional)</span></label>
        <input type="email" name="o365_email" class="input" placeholder="anna@firma.de">
      </div>
      <div class="border border-gray-800 rounded-lg p-3">
        <p class="text-xs text-gray-400 font-medium mb-2">Benachrichtigungen per WhatsApp DM</p>
        <div class="flex gap-4">
          <label class="flex items-center gap-2 text-sm cursor-pointer text-gray-300">
            <input type="checkbox" name="notify_on_task" checked class="rounded border-gray-600"> Aufgaben
          </label>
          <label class="flex items-center gap-2 text-sm cursor-pointer text-gray-300">
            <input type="checkbox" name="notify_on_appointment" checked class="rounded border-gray-600"> Termine
          </label>
          <label class="flex items-center gap-2 text-sm cursor-pointer text-gray-300">
            <input type="checkbox" name="notify_on_keyword" checked class="rounded border-gray-600"> Keywords
          </label>
        </div>
      </div>
      <div class="flex gap-3 pt-1">
        <button type="submit" class="btn-primary flex-1">Speichern</button>
        <button type="button" class="btn-secondary" onclick="closeAddModal()">Abbrechen</button>
      </div>
    </form>
  </div>
</div>

<script>
  function openAddModal() {
    document.getElementById('add-owner-modal').classList.remove('hidden');
    document.getElementById('add-owner-form').reset();
  }
  function closeAddModal() {
    document.getElementById('add-owner-modal').classList.add('hidden');
  }

  function renderOwners(owners) {
    const container = document.getElementById('owners-list');
    if (!owners.length) {
      container.innerHTML = `<div class="card text-center py-12">
        <p class="text-4xl mb-3">👤</p>
        <p class="text-gray-400 font-medium">Noch keine Besitzer angelegt</p>
        <p class="text-gray-600 text-sm mt-1">Füge Familienmitglieder hinzu, um WhatsApp-Nachrichten zuzuordnen</p>
      </div>`;
      return;
    }
    container.innerHTML = owners.map(o => `
      <div class="card">
        <div class="flex items-start justify-between gap-4">
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2 flex-wrap">
              <h3 class="font-semibold text-base">${o.name}</h3>
              ${o.active ? '<span class="badge-green">aktiv</span>' : '<span class="badge-red">inaktiv</span>'}
            </div>
            <p class="text-gray-400 text-sm mt-1">📱 +${o.phone}</p>
            ${o.o365_email ? `<p class="text-gray-400 text-sm">📧 ${o.o365_email}</p>` : ''}
            ${o.aliases.length ? `<p class="text-gray-500 text-xs mt-1">Aliase: ${o.aliases.join(', ')}</p>` : ''}
          </div>
          <button class="btn-danger shrink-0" onclick="deleteOwner(${o.id}, '${o.name}')">Löschen</button>
        </div>

        <!-- Keywords -->
        <div class="mt-4 pt-4 border-t border-gray-800">
          <p class="text-xs text-gray-500 font-medium uppercase tracking-wide mb-2">Keywords</p>
          <div id="kw-${o.id}" class="flex flex-wrap gap-2 mb-3 min-h-[24px]">
            ${o.keywords.map(k => `
              <span class="badge-blue gap-1">
                ${k.word}
                <button onclick="deleteKeyword(${o.id}, ${k.id})" class="ml-0.5 opacity-60 hover:opacity-100 leading-none">×</button>
              </span>`).join('') || '<span class="text-gray-600 text-xs italic">Keine Keywords</span>'}
          </div>
          <form class="flex gap-2" onsubmit="addKeyword(event, ${o.id})">
            <input type="text" placeholder="Keyword hinzufügen..." class="input text-xs py-1.5 flex-1">
            <button type="submit" class="btn-primary text-xs px-3 py-1.5">+ Hinzufügen</button>
          </form>
        </div>

        <!-- Notification flags -->
        <div class="flex gap-4 mt-3 text-xs text-gray-500">
          <span class="${o.notify_on_task ? 'text-green-400' : ''}">${o.notify_on_task ? '🔔' : '🔕'} Aufgaben</span>
          <span class="${o.notify_on_appointment ? 'text-green-400' : ''}">${o.notify_on_appointment ? '🔔' : '🔕'} Termine</span>
          <span class="${o.notify_on_keyword ? 'text-green-400' : ''}">${o.notify_on_keyword ? '🔔' : '🔕'} Keywords</span>
        </div>
      </div>
    `).join('');
  }

  async function loadOwners() {
    try {
      const r = await apiFetch('/api/owners');
      const owners = await r.json();
      renderOwners(owners);
    } catch(err) { console.error('loadOwners:', err); }
  }

  document.getElementById('add-owner-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const payload = {
      name: fd.get('name'),
      phone: fd.get('phone'),
      aliases_raw: fd.get('aliases_raw') || '',
      o365_email: fd.get('o365_email') || '',
      notify_on_task: e.target.querySelector('[name=notify_on_task]').checked,
      notify_on_appointment: e.target.querySelector('[name=notify_on_appointment]').checked,
      notify_on_keyword: e.target.querySelector('[name=notify_on_keyword]').checked,
    };
    const btn = e.target.querySelector('[type=submit]');
    btn.disabled = true;
    try {
      const resp = await apiFetch('/api/owners', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
      });
      if (resp.ok) {
        closeAddModal();
        showToast('Besitzer erstellt');
        loadOwners();
      } else {
        const err = await resp.json().catch(() => ({}));
        showToast('Fehler: ' + (err.detail || resp.statusText), 'error');
      }
    } catch(err) { showToast('Netzwerkfehler', 'error'); }
    btn.disabled = false;
  });

  async function deleteOwner(id, name) {
    if (!confirm(`Besitzer "${name}" wirklich löschen?`)) return;
    const r = await apiFetch(`/api/owners/${id}`, {method: 'DELETE'});
    if (r.ok) { showToast(`"${name}" gelöscht`); loadOwners(); }
    else showToast('Fehler beim Löschen', 'error');
  }

  async function addKeyword(e, ownerId) {
    e.preventDefault();
    const input = e.target.querySelector('input');
    const word = input.value.trim();
    if (!word) return;
    const resp = await apiFetch(`/api/owners/${ownerId}/keywords`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({word})
    });
    if (resp.ok) { input.value = ''; showToast('Keyword hinzugefügt'); loadOwners(); }
    else showToast('Fehler', 'error');
  }

  async function deleteKeyword(ownerId, kwId) {
    const resp = await apiFetch(`/api/owners/${ownerId}/keywords/${kwId}`, {method: 'DELETE'});
    if (resp.ok) { showToast('Keyword entfernt'); loadOwners(); }
  }

  loadOwners();
</script>
{% endblock %}
