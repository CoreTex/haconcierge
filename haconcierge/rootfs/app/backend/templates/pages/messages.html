{% extends "base.html" %}
{% set page = "messages" %}
{% block content %}
<div class="max-w-4xl mx-auto">
  <h1 class="text-2xl font-bold mb-6">Nachrichten</h1>
  <div id="messages-container" class="space-y-3"
       hx-get="/api/whatsapp/messages?limit=50" hx-trigger="load" hx-swap="innerHTML">
    <div class="text-gray-500 text-sm">Lade Nachrichten...</div>
  </div>
</div>
<script>
  document.addEventListener('htmx:afterRequest', function(e) {
    if (!e.detail.pathInfo.requestPath.includes('/api/whatsapp/messages')) return;
    try {
      const messages = JSON.parse(e.detail.xhr.responseText);
      document.getElementById('messages-container').innerHTML = messages.length
        ? messages.map(m => `
          <div class="card">
            <div class="flex items-start justify-between gap-3">
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2 mb-1">
                  <span class="font-medium text-sm">${m.sender_name || m.chat_jid}</span>
                  ${m.is_group ? '<span class="badge-blue text-xs">Gruppe</span>' : '<span class="badge-green text-xs">DM</span>'}
                  ${m.processed ? '<span class="badge-green text-xs">✓ verarbeitet</span>' : '<span class="badge-yellow text-xs">ausstehend</span>'}
                </div>
                <p class="text-sm text-gray-300 break-words">${m.content}</p>
                ${m.ai_result?.summary ? `<p class="text-xs text-gray-500 mt-1">KI: ${m.ai_result.summary}</p>` : ''}
              </div>
              <span class="text-xs text-gray-600 shrink-0">${new Date(m.timestamp).toLocaleString('de-DE')}</span>
            </div>
          </div>`).join('')
        : '<div class="card text-gray-500 text-center py-10">Keine Nachrichten</div>';
    } catch(e) { console.error(e); }
  });
</script>
{% endblock %}
