{% extends "base.html" %}
{% set page = "dashboard" %}
{% block content %}
<div class="max-w-5xl mx-auto">
  <h1 class="text-2xl font-bold mb-6">Dashboard</h1>

  <!-- Stats grid -->
  <div class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-8"
       hx-get="/api/dashboard" hx-trigger="load, every 60s" hx-swap="innerHTML" hx-target="#stats-area">
  </div>
  <div id="stats-area" class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-8"
       hx-get="/api/dashboard" hx-trigger="load, every 60s">
    <div class="card animate-pulse h-24"></div>
    <div class="card animate-pulse h-24"></div>
    <div class="card animate-pulse h-24"></div>
  </div>

  <div class="grid md:grid-cols-2 gap-6">
    <!-- Recent Tasks -->
    <div class="card">
      <h2 class="font-semibold mb-4 text-lg">Offene Aufgaben</h2>
      <div hx-get="/api/dashboard" hx-trigger="load" hx-swap="innerHTML" hx-target="#recent-tasks">
        <div class="text-gray-500 text-sm">Laden...</div>
      </div>
      <div id="recent-tasks"></div>
    </div>

    <!-- Upcoming Appointments -->
    <div class="card">
      <h2 class="font-semibold mb-4 text-lg">Nächste Termine</h2>
      <div id="upcoming-appts" hx-get="/api/dashboard" hx-trigger="load" hx-swap="innerHTML">
        <div class="text-gray-500 text-sm">Laden...</div>
      </div>
    </div>
  </div>
</div>

<script>
  document.addEventListener('htmx:afterRequest', function(e) {
    if (e.detail.pathInfo.requestPath !== '/api/dashboard') return;
    const data = JSON.parse(e.detail.xhr.responseText);
    const stats = data.stats;

    document.getElementById('stats-area').innerHTML = `
      <div class="card"><p class="text-3xl font-bold text-blue-400">${stats.messages_this_week}</p><p class="text-gray-400 text-sm mt-1">Nachrichten (7 Tage)</p></div>
      <div class="card"><p class="text-3xl font-bold text-yellow-400">${stats.open_tasks}</p><p class="text-gray-400 text-sm mt-1">Offene Aufgaben</p></div>
      <div class="card"><p class="text-3xl font-bold text-green-400">${stats.upcoming_appointments}</p><p class="text-gray-400 text-sm mt-1">Kommende Termine</p></div>
      <div class="card"><p class="text-3xl font-bold text-purple-400">${stats.keyword_hits_week}</p><p class="text-gray-400 text-sm mt-1">Keywords (7 Tage)</p></div>
      <div class="card"><p class="text-3xl font-bold text-white">${stats.active_owners}</p><p class="text-gray-400 text-sm mt-1">Aktive Besitzer</p></div>
      <div class="card"><p class="text-3xl font-bold text-gray-300">${stats.total_messages}</p><p class="text-gray-400 text-sm mt-1">Nachrichten gesamt</p></div>
    `;

    const taskHtml = data.recent_tasks.length
      ? data.recent_tasks.map(t => `
        <div class="flex items-center justify-between py-2 border-b border-gray-800 last:border-0">
          <span class="text-sm truncate">${t.title}</span>
          <span class="badge-yellow ml-2 shrink-0">${t.status}</span>
        </div>`).join('')
      : '<p class="text-gray-500 text-sm">Keine offenen Aufgaben</p>';
    document.getElementById('recent-tasks').innerHTML = taskHtml;

    const apptHtml = data.upcoming_appointments.length
      ? data.upcoming_appointments.map(a => `
        <div class="flex items-center justify-between py-2 border-b border-gray-800 last:border-0">
          <div>
            <p class="text-sm">${a.title}</p>
            <p class="text-xs text-gray-500">${new Date(a.start_time).toLocaleString('de-DE')}</p>
          </div>
        </div>`).join('')
      : '<p class="text-gray-500 text-sm">Keine Termine</p>';
    document.getElementById('upcoming-appts').innerHTML = apptHtml;
  });
</script>
{% endblock %}
