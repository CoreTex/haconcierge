{% extends "base.html" %}
{% set page = "appointments" %}
{% block content %}
<div class="max-w-4xl mx-auto">
  <div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-bold">Termine</h1>
    <button onclick="loadAppointments()" class="btn-secondary text-xs px-3 py-1.5">↻</button>
  </div>
  <div id="appts-container" class="space-y-3">
    <div class="card skeleton h-16"></div>
    <div class="card skeleton h-16"></div>
    <div class="card skeleton h-16"></div>
  </div>
</div>

<script>
  async function loadAppointments() {
    try {
      const r = await apiFetch('/api/dashboard');
      if (!r.ok) throw new Error(r.status);
      const data = await r.json();
      const appts = data.upcoming_appointments || [];
      const container = document.getElementById('appts-container');

      if (!appts.length) {
        container.innerHTML = `<div class="card text-center py-12">
          <p class="text-4xl mb-3">📅</p>
          <p class="text-gray-400 font-medium">Keine anstehenden Termine</p>
          <p class="text-gray-600 text-sm mt-1">Termine werden aus WhatsApp-Nachrichten extrahiert</p>
        </div>`;
        return;
      }

      container.innerHTML = appts.map(a => `
        <div class="card-hover">
          <div class="flex items-start justify-between gap-4">
            <div class="flex-1 min-w-0">
              <p class="font-medium text-sm text-gray-200">${a.title}</p>
              <p class="text-sm text-gray-400 mt-1">${new Date(a.start_time).toLocaleString('de-DE', {weekday:'short', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'})}</p>
              ${a.location ? `<p class="text-xs text-gray-500 mt-0.5">📍 ${a.location}</p>` : ''}
            </div>
            <span class="badge-blue shrink-0">📅</span>
          </div>
        </div>
      `).join('');
    } catch(err) {
      console.error('loadAppointments:', err);
    }
  }

  loadAppointments();
</script>
{% endblock %}
