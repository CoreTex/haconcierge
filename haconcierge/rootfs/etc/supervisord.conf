[supervisord]
nodaemon=true
logfile=/tmp/haconcierge/supervisord.log
pidfile=/tmp/haconcierge/supervisord.pid
loglevel=info

[unix_http_server]
file=/tmp/haconcierge/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/haconcierge/supervisor.sock

[program:backend]
command=python3 /app/backend/main.py
directory=/app/backend
autostart=true
autorestart=true
startretries=5
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1",DATA_DIR="%(ENV_DATA_DIR)s",SESSION_DIR="%(ENV_SESSION_DIR)s",HA_TOKEN="%(ENV_HA_TOKEN)s",HA_URL="%(ENV_HA_URL)s"

[program:whatsapp-bridge]
command=node /app/whatsapp-bridge/src/index.js
directory=/app/whatsapp-bridge
autostart=true
autorestart=true
startretries=10
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=NODE_ENV="production",SESSION_DIR="%(ENV_SESSION_DIR)s",BACKEND_URL="http://127.0.0.1:8099"
